<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin panel for portfolio messages">
    <title>Admin Login | Messages</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <!-- Boxicons for Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
        }

        .login-box {
            background: var(--second-bg-color);
            padding: 4rem 3rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 0 1.5rem var(--main-color);
            width: 100%;
            max-width: 400px;
            border: .2rem solid var(--bg-color);
        }

        .login-box i {
            font-size: 5rem;
            color: var(--main-color);
            margin-bottom: 1.5rem;
        }

        .login-box h2 {
            font-size: 3rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }

        .login-box input {
            width: 100%;
            padding: 1.5rem;
            font-size: 1.6rem;
            color: var(--text-color);
            background: var(--bg-color);
            border-radius: .8rem;
            margin-bottom: 2rem;
            border: .1rem solid transparent;
            transition: .3s ease;
        }

        .login-box input:focus {
            border-color: var(--main-color);
        }

        .login-box .btn {
            width: 100%;
            cursor: pointer;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 1.4rem;
            margin-top: 1.5rem;
            display: none;
        }

        .success-box {
            display: none;
            margin-top: 2rem;
        }

        .success-box a {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--main-color);
            font-size: 1.6rem;
            text-decoration: underline;
        }
        
        .back-link {
            display: block;
            margin-top: 2rem;
            font-size: 1.4rem;
            color: var(--text-color);
        }
        
        .back-link:hover {
            color: var(--main-color);
        }
    </style>
</head>

<body>

    <section class="admin-login">
        <div class="login-box" id="login-container">
            <i class='bx bx-lock-alt'></i>
            <h2>Admin Access</h2>
            <p style="font-size: 1.4rem; margin-bottom: 2rem;">Enter password to view messages.</p>
            
            <input type="password" id="admin-password" placeholder="Password" required>
            <button class="btn" onclick="checkPassword()">Login</button>
            
            <p class="error-msg" id="error-msg">Incorrect password. Please try again.</p>

            <div class="success-box" id="success-box">
                <i class='bx bx-check-circle' style="color: #00ff00; font-size: 4rem;"></i>
                <h3 style="font-size: 2.2rem; margin-bottom: 1rem;">Access Granted</h3>
                <p style="font-size: 1.4rem;">Click the link below to view your contact form messages in Google Sheets.</p>
                <a href="#" id="sheet-link" target="_blank">Open Messages Dashboard</a>
            </div>

            <a href="index.html" class="back-link"><i class='bx bx-arrow-back'></i> Back to Portfolio</a>
        </div>
    </section>

    <script>
        function checkPassword() {
            const passwordInput = document.getElementById('admin-password').value;
            const errorMsg = document.getElementById('error-msg');
            const successBox = document.getElementById('success-box');
            const sheetLink = document.getElementById('sheet-link');
            
            // --- EDIT THIS LINE TO CHANGE YOUR PASSWORD ---
            const correctPassword = "admin"; 
            
            // --- EDIT THIS LINE TO ADD YOUR GOOGLE SHEET LINK ---
            const myGoogleSheetURL = "https://docs.google.com/spreadsheets/u/0/"; 

            if (passwordInput === correctPassword) {
                // Hide input elements
                document.getElementById('admin-password').style.display = 'none';
                document.querySelector('.btn').style.display = 'none';
                errorMsg.style.display = 'none';
                
                // Show success box and set link
                successBox.style.display = 'block';
                sheetLink.href = myGoogleSheetURL;
            } else {
                // Show error message
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>

</html>
